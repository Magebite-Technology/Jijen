# SPDX-License-Identifier: LGPL-2.1-or-later
name: Jijen Windows Beta

on:
  workflow_dispatch:
  push:
    branches:
      - feature/surface-contours-phase-1
    paths:
      - .github/workflows/build_beta_windows.yml
      - src/Mod/Part/**
      - package/**
      - freecad_version.txt
# Phase 7 semantic role-aware contour triggers

permissions:
  contents: read

concurrency:
  group: jijen-windows-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-beta:
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      TARGET_PLATFORM: win-64
      WINDOWS_SIGN_RELEASE: "0"
      MAKE_INSTALLER: "true"
      UPLOAD_RELEASE: "false"
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}
      PIXI_CACHE_DIR: D:/rattler
      RATTLER_CACHE_DIR: D:/rattler
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set beta identity
        run: |
          $tag = "beta-windows-${{ github.run_number }}-$($env:SOURCE_SHA.Substring(0, 7))"
          "BUILD_TAG=$tag" >> $env:GITHUB_ENV
          "## Jijen Windows beta" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:SOURCE_SHA ($env:SOURCE_BRANCH)" >> $env:GITHUB_STEP_SUMMARY
          "Phase 7 adds semantic surface-role classification to the Phase 6 object-level contour workflow: select one object, choose a reference direction and role such as top, bottom, side, or sole candidate, and create a confidence-scored parametric contour without manual face picking. Curved faces are sampled; the result is an inspectable heuristic, not a claim that CAD topology contains universal footwear semantics." >> $env:GITHUB_STEP_SUMMARY

      - name: Set up the locked build environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          cache: false
          locked: true

      - name: Compile and install Jijen
        shell: bash
        run: |
          set -euo pipefail
          python3 package/scripts/write_version_info.py ../freecad_version.txt
          pixi run --locked bash package/bundle/build.sh

      - name: Create portable package and installer
        shell: bash
        run: |
          set -euo pipefail
          cd package/bundle/windows
          pixi run --locked bash create_bundle.sh

      - name: Validate packaged surface contour tests
        run: |
          $bundles = @(Get-ChildItem -LiteralPath package/bundle/windows -Directory -Filter "FreeCAD_$($env:BUILD_TAG)-Windows-*")
          if ($bundles.Count -ne 1) { throw "Expected one beta bundle" }
          $exe = Join-Path $bundles[0].FullName 'bin/freecadcmd.exe'
          $testCode = 'import unittest; from parttests.TestSurfaceContourFixtures import TestSurfaceContourFixtures; from parttests.TestSurfaceContours import TestSurfaceContours; from parttests.TestSurfaceRegions import TestSurfaceRegions; from parttests.TestRegionContours import TestRegionContours; from parttests.TestSurfaceContourGui import TestSurfaceContourGui; from parttests.TestSurfaceContourParametric import TestSurfaceContourParametric; from parttests.TestSurfaceSemantics import TestSurfaceSemantics; suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromTestCase(case) for case in (TestSurfaceContourFixtures, TestSurfaceContours, TestSurfaceRegions, TestRegionContours, TestSurfaceContourGui, TestSurfaceContourParametric, TestSurfaceSemantics)); result = unittest.TextTestRunner(verbosity=2).run(suite); print("JIJEN_BETA_FIXTURES_OK" if result.wasSuccessful() and result.testsRun == 67 else "JIJEN_BETA_FIXTURES_FAILED")'
          $output = & $exe --safe-mode --console $testCode 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath beta-fixture-tests.log
          if ($exitCode -ne 0 -or @($output | ForEach-Object { $_.ToString().Trim() }) -notcontains 'JIJEN_BETA_FIXTURES_OK') {
            throw "Packaged fixture validation failed"
          }

      - name: Publish the Windows beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $folder = Resolve-Path -LiteralPath package/bundle/windows
          $archives = @(Get-ChildItem -LiteralPath $folder -File -Filter "FreeCAD_$($env:BUILD_TAG)-Windows-*.7z")
          $installers = @(Get-ChildItem -LiteralPath $folder -File -Filter "FreeCAD_$($env:BUILD_TAG)-Windows-*-installer.exe")
          $hashes = @(Get-ChildItem -LiteralPath $folder -File -Filter "FreeCAD_$($env:BUILD_TAG)-Windows-*-SHA256.txt")
          if ($archives.Count -ne 1 -or $installers.Count -ne 1 -or $hashes.Count -ne 2) {
            throw "Missing beta packages or SHA256 files"
          }
          $assets = @($archives + $installers + $hashes | ForEach-Object { $_.FullName })
          $notes = "Windows x64 beta from $env:SOURCE_BRANCH, commit $env:SOURCE_SHA. Includes Phase 7 semantic surface-role classification with reference directions and confidence-scored top, bottom, side, sole-candidate, and unknown roles; Phase 6 parametric contour previews; the Phase 5 object-level contour task panel; grouped physical-boundary previews; Phase 3 detection; Phase 2 individual-face 3D boundaries; holes; periodic-seam handling; and static Python-console previews. The panel accepts one object and does not require manual face picking. Semantic classification is heuristic and inspectable. Portable archive and installer are unsigned. Packaged startup, Pivy, and all 67 surface-contour tests must pass before publication."
          gh release create $env:BUILD_TAG @assets --target $env:SOURCE_SHA --title "Jijen Windows beta $env:BUILD_TAG" --notes $notes --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Beta publication failed" }
          $url = gh release view $env:BUILD_TAG --json url --jq .url
          "Download: $url" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload fixture test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-beta-test-log-${{ github.run_id }}
          path: beta-fixture-tests.log
          if-no-files-found: ignore
          retention-days: 7
